# Render 配置（西江阅后端）— 在 Render 控制台 New → Blueprint 指向本仓库即可
services:
  - type: web
    name: xijiangyue-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SECRET
        generateValue: true        # Render 自动生成强随机值
      - key: DATA_DIR
        value: /var/data           # 挂 free 磁盘
    disk:
      name: xijiangyue-data
      mountPath: /var/data
      sizeGB: 1
